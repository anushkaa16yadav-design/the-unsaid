<!DOCTYPE html>
<html>

<head>
  <title>Poetry | The Unsaid</title>

  <style>
    body {
      margin: 0;
      background-color: #f5f0e8;
      color: #2d2926;
      font-family: Georgia, serif;
      text-align: center;
      padding: 60px 25px;
      transition: 0.4s;
    }

    h1 {
      font-size: 55px;
      font-weight: normal;
    }

    .intro {
      color: #625b54;
      font-style: italic;
      font-size: 18px;
      margin-bottom: 60px;
    }

    .poem {
      max-width: 650px;
      margin: 0 auto 40px;
      padding: 35px;
      border: 1px solid #d8cfc2;
      background-color: #f8f4ee;
    }

    .poem h2 {
      font-weight: normal;
    }

    .poem p {
      line-height: 1.9;
      color: #625b54;
    }

    button {
      padding: 10px 18px;
      border: 1px solid #8f857a;
      background: transparent;
      color: inherit;
      font-family: Georgia, serif;
      cursor: pointer;
      margin-bottom: 40px;
    }

    #thought {
      display: none;
      font-style: italic;
      margin-top: 25px;
      color: #625b54;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Dark Mode */

    .dark {
      background-color: #2d2926;
      color: #f5f0e8;
    }

    .dark .intro,
    .dark .poem p,
    .dark #thought {
      color: #d8cfc2;
    }

    .dark .poem {
      background-color: #3a3531;
      border-color: #625b54;
    }
  </style>

</head>

<body>

  <h1>Poetry</h1>

  <p class="intro">
    For the things we feel, but never quite say.
  </p>

  <button onclick="toggleMode()" id="modeButton">
    🌙 Dark Mode
  </button>

  <div class="poem">

    <h2>Between the Lines</h2>

    <p>
      Some feelings live<br>
      between the words,<br>
      in pauses,<br>
      in silences,<br>
      in everything we leave unsaid.
    </p>

  </div>

  <button onclick="showThought()">
    Read another thought
  </button>

  <p id="thought">
    Sometimes silence says what words are too afraid to.
  </p>

  <p>
    <a href="index.html">← Back to The Unsaid</a>
  </p>


  <script>

    function toggleMode() {

      document.body.classList.toggle("dark");

      const button = document.getElementById("modeButton");

      if (document.body.classList.contains("dark")) {
        button.innerHTML = "☀️ Light Mode";
      } else {
        button.innerHTML = "🌙 Dark Mode";
      }

    }


    function showThought() {

      const thought = document.getElementById("thought");

      thought.style.display = "block";

    }

  </script>

</body>

</html>
