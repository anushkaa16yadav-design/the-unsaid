<!DOCTYPE html>
<html>

<head>
  <title>Poetry | The Unsaid</title>

  <style>
    body {
      margin: 0;
      background-color: #f5f0e8;
      color: #2d2926;
      font-family: Georgia, serif;
      text-align: center;
      padding: 60px 25px;
    }

    h1 {
      font-size: 55px;
      font-weight: normal;
    }

    .intro {
      color: #625b54;
      font-style: italic;
      font-size: 18px;
      margin-bottom: 60px;
    }

    .poem {
      max-width: 650px;
      margin: 0 auto 50px;
      padding: 35px;
      border: 1px solid #d8cfc2;
      background-color: #f8f4ee;
    }

    .poem h2 {
      font-weight: normal;
    }

    .poem p {
      line-height: 1.9;
      color: #625b54;
    }

    a {
      color: #2d2926;
      text-decoration: none;
    }
  </style>

</head>

<body>

  <h1>Poetry</h1>

  <p class="intro">
    For the things we feel, but never quite say.
  </p>

  <div class="poem">
    <h2>Between the Lines</h2>

    <p>
      Some feelings live<br>
      between the words,<br>
      in pauses,<br>
      in silences,<br>
      in everything we leave unsaid.
    </p>
  </div>

  <p><a href="index.html">← Back to The Unsaid</a></p>

</body>

</html>
